[package]
edition      = "2024"
name         = "restful_server"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "restful_server"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c6", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = ["dhcpv4", "dhcpv4-hostname", "log", "medium-ethernet", "multicast", "tcp", "udp"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32c6",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32c6", "log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32c6",
  "log-04",
  "unstable",
  "wifi",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
picoserve = { version = "0.21", features = ["embassy", "json", "log"] }
serde = { version = "1", default-features = false, features = ["derive"] }
edge-mdns = { version = "0.8", default-features = false, features = ["io"] }
# Default "all" adds embassy-net DNS (an extra socket), ICMP and IPv6; mDNS needs none of them.
edge-nal-embassy = { version = "0.9", default-features = false, features = [
  "multicast",
  "proto-ipv4",
  "udp",
] }
edge-nal = "0.7"
embassy-futures = "0.1.2"
embassy-sync = "0.8"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

[features]
default = ["web"]
# Embed front/web-demo/dist, CONFIG_EXAMPLE_DEPLOY_WEB_PAGES in the C build.
web = []
# GET /api/v1/heap for bench/http_bench.py, EXAMPLE_HEAP_STATS in the C build.
heap-stats = ["esp-alloc/internal-heap-stats"]
